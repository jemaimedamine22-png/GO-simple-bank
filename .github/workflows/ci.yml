name: ci-test

on:
    push:
        branches: main

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
        - name:
          uses: actions/setup-go@v2
          with:
            go-version: 1.26.0
          id: go

        - name: check out code into the Go module directory
          uses: actions/checkout@v2

        - name: Test
          run: make test
